name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install ".[dev]"
      # 只运行确定性的仓库级测试，不读取真实聊天数据或调用 DeepSeek Evaluation。
      - name: Run tests
        run: pytest -q
      - name: Run Ruff
        run: ruff check src tests
      - name: Run mypy
        run: mypy
