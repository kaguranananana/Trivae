[project]
name = "trivae"
version = "0.1.0"
description = "High-noise group chat intelligence analysis system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    # 当前 streamed/cancellation contract 已按本地验证的 SDK API 固定到 0.22.0。
    "openai-agents==0.22.0",
    # semantic index 使用 sqlite-vec；sentence-transformers 放在可选 extra，避免检索-only 启动下载模型。
    "sqlite-vec>=0.1.9,<0.2",
    # 默认 `trivae chat` 使用 Textual TUI；--plain 与非 TTY 回退到 stdout renderer。
    # 2.0 起提供 Screen 级原生文本选择/复制；上界覆盖当前已验证的 8.x API。
    "textual>=2,<9",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers>=3,<6",
]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
trivae = "trivae.interfaces.cli:main"

[tool.trivae]
source-directory = "src"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# tqdm 是 [semantic] extra 的传递依赖（无官方类型存根）；process_warmup 仅调用其公开类方法。
module = "tqdm.*"
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
