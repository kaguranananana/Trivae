[project]
name = "trivae"
version = "0.1.0"
description = "High-noise group chat intelligence analysis system"
requires-python = ">=3.12"
dependencies = [
    # 当前 streamed/cancellation contract 已按本地验证的 SDK API 固定到 0.22.0。
    "openai-agents==0.22.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
trivae = "trivae.interfaces.cli:main"

[tool.trivae]
source-directory = "src"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
